<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/Create.css">
</head>
<body class="background">
<div class="Login">
<h2>Modal Register Form</h2>

<button onclick="document.getElementById('userForm').style.display='block'" style="width:auto;">Register</button>
</div>
<div id="userForm" class="modal">
  
  <form class="modal-content animate" action="/" method="post">
    <div class="imgcontainer">
      <span onclick="document.getElementById('userForm').style.display='none'" class="close" title="Close Modal">&times;</span>
    </div>
    
    <div class="container">
      <label for="uname"><b>First Name</b></label>
      <input type="text" placeholder="Enter First Name" name="fname" required>

      <label for="psw"><b>Name</b></label>
      <input type="text" placeholder="Enter Name" name="name" required>

      <label for="psw"><b>Email</b></label>
      <input type="email" placeholder="Enter Email" name="email" required>

      <label for="psw"><b>Password</b></label>
      <input type="password" placeholder="Enter Password" name="pwd" required>
        
      <button type="submit">Register me</button>
      <label>
        <input type="checkbox" checked="checked" name="remember"> Remember me
      </label>
    </div>

    <div class="btnregister" style="background-color:#f1f1f1">
      <button type="button" onclick="document.getElementById('userForm').style.display='none'" class="cancelbtn">Cancel</button>
      <span class="psw">Forgot <a href="#">password?</a></span>
    </div>
  </form>
</div>

<script src="/main.js" defer></script>

</body>
</html>
