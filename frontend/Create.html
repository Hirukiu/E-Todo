<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/Create.css">
</head>
<body class="background">
<div class="Login">
<h2>Modal Register Form</h2>

<button onclick="document.getElementById('id01').style.display='block'" style="width:auto;">Register</button>
</div>
<div id="userForm" class="modal">
  
  <form class="modal-content animate" action="/action_page.php" method="post">
    <div class="imgcontainer">
      <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal">&times;</span>
    </div>
    
    <div class="container">
      <label for="uname"><b>First Name</b></label>
      <input type="text" placeholder="Enter First Name" name="fname" required>

      <label for="psw"><b>Name</b></label>
      <input type="text" placeholder="Enter Name" name="name" required>

      <label for="psw"><b>Email</b></label>
      <input type="email" placeholder="Enter Email" name="email" required>

      <label for="psw"><b>Password</b></label>
      <input type="password" placeholder="Enter Password" name="pwd" required>
        
      <button type="submit">Login</button>
      <label>
        <input type="checkbox" checked="checked" name="remember"> Remember me
      </label>
    </div>

    <div class="container" style="background-color:#f1f1f1">
      <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancel</button>
      <span class="psw">Forgot <a href="#">password?</a></span>
    </div>
  </form>
</div>

<script>
  // Get the modal
  var modal = document.getElementById('userForm');

  // When the user clicks anywhere outside of the modal, close it
  window.onclick = function(event) {
      if (event.target == modal) {
          modal.style.display = "none";
      }
  }

  const form = document.getElementById("userForm");
  const responseEl = document.getElementById("response");

  const user = {
        email: document.getElementById("email").value,
        name: document.getElementById("name").value,
        firstname: document.getElementById("fname").value,
        password: document.getElementById("pwd").value
      };

  const res = await fetch("http://localhost:5000", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user) // on envoie l’objet JSON
        });

</script>

</body>
</html>
