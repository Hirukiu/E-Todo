        <div class="todo">
            <div id="task-container">
                    
            </div>
        </div>
        
    </main>



    <div id="Folder-mod" class="modal">
        <div class="folder-content animate">
        <span class="cls">&times;</span>
        <h2>Add Task</h2>
            
                
                <div class="add-task-body">
                    <div class="add-task-input">
                        <input type="text" placeholder="Task Name" class="task-name">
                    </div>
                    <div class="add-task-input">
                        <input type="text" placeholder="description" class="task-description">
                    </div>
                    <div class="add-task-input">
                        <input type="text" placeholder="status" class="task-status">
                    </div>
                    <div class="add-task-input">
                        <input type="datetime-local" placeholder="Task Time To" class="task-time-to">
                    </div>
                    <div class="add-task-input">
                        <select class="task-priority">
                            <option value="not-started">Not Started</option>
                            <option value="todo">todo</option>
                            <option value="in progress">in progress</option>
                            <option value="done">done</option>
                        </select>
                    </div>
                </div>
                <div class="add-task-footer">
                    <button class="add-task-btn">add task</button>
                </div>
                
        </div>
    </div>
