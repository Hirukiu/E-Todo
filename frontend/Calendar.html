    <main>
        <aside>


            <div class="container">
                <div class="left">
                    <div class="calendar">
                        <div class="month">
                            <i class="fa fa-angle-left prev"></i>
                            <div class="date">november 2025</div>
                            <i class="fa-angle-right next"></i>
                        </div>
                        <div class="weekdays">
                            <div>Mon</div>
                            <div>Tue</div>
                            <div>Wed</div>
                            <div>Thu</div>
                            <div>Fri</div>
                            <div>Sat</div>
                            <div>Sun</div>
                        </div>
                        <div class="days">
                            
                        </div>
                        <div class="goto-today">
                            <div class="goto">
                                <input type="text" placeholder="mm/yyyy" class="date-input">
                                <button class="goto-btn">go</button>
                            </div>
                            <button class="today-btn">today</button>
                        </div>
                    </div>
                </div>
            </div>


        </aside>
