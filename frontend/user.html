<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User info</title>
    <link rel="stylesheet" href="css/user.css">
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="front">
                <h1>User Name</h1>
            </div>
            <div class="back">
                <h2>ID user info</h2>
                <ul>
                    <li>
                        <span>name :</span>
                        <span class="name">e</span>
                    </li>
                    <li>
                        <span>firstname :</span>
                        <span class="firstname">e</span>
                    </li>
                    <li>
                        <span>create_at :</span>
                        <span class="create_at">e</span>
                    </li>
                    <li>
                        <span>email :</span>
                        <span class="email">e</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <script src="user.js"></script>
</body>
</html>
