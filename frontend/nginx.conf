# Configuration Nginx pour Reverse Proxy
server {
    listen 80;
    server_name localhost;

    # Ajout de Create.html comme fichier d'index par défaut
    root /usr/share/nginx/html;
    index Create.html index.html;
    
    # Gestion des routes pour les applications SPA (Single Page Application)
    # Redirige toutes les requêtes non-fichiers vers Create.html
    location / {
        # Si la requête n'est pas un fichier ($uri) ou un répertoire ($uri/),
        # Nginx essaiera de renvoyer le fichier Create.html
        try_files $uri $uri/ /Create.html;
    }

    # Configuration du Reverse Proxy pour l'API
    # Toutes les requêtes vers /api/... sont transmises au service 'backend' Docker.
    location /api/ {
        # 'backend' est le nom du service Docker Compose
        proxy_pass http://backend:5000;
        
        # En-têtes standards pour les proxys
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}