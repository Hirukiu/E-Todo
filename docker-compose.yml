version: "3.8"

services:
  web:
    build: ./backend

    container_name: etodo-web

    ports:
      - "${PORT}:8080"

    volumes:
      - .:/var/www/html

    depends_on:
      - db

    networks:
      - etodo-network

    environment:
      - PORT=${PORT}
      - SECRET=${SECRET}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}


  db:
    image: mysql:8

    container_name: etodo-db

    environment:

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      MYSQL_DATABASE: ${MYSQL_DATABASE}

      MYSQL_USER: ${MYSQL_USER}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./e-todo.sql

    ports:
      - "3306:3306"

    networks:
      - etodo-network

volumes:
  mysql-data:

networks:
  etodo-network:
